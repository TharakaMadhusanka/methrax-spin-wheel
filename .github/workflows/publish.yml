name: Publish to npm

on:
  push:
    branches:
      - 'release/**'

jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:spin-wheel

      - name: Validate release version
        run: |
          BRANCH_VERSION=${GITHUB_REF_NAME#release/}
          PACKAGE_VERSION=$(node -p "require('./dist/spin-wheel/package.json').version")

          echo "Branch : $BRANCH_VERSION"
          echo "Package: $PACKAGE_VERSION"

          if [ "$BRANCH_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release branch version does not match package version."
            exit 1
          fi

      - name: Publish
        working-directory: dist/spin-wheel
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
